[package]
name = "physica"
version = "1.0.0"
edition = "2021"
default-run = "physica"

[lib]
name = "physica_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.9"
rand_chacha = "0.9"
rfd = "0.15"

[dev-dependencies]
tempfile = "3"

[profile.release]
strip = true
lto = "thin"
